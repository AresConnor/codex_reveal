[project]
name = "reveal"
version = "0.1.0"
description = "Codex Desktop log viewer — browse sessions and monitor SSE events in real time"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
reveal = "reveal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reveal"]
